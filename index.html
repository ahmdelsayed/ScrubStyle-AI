<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScrubStyle AI</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#2a2220;--mute:#7a6d66;--line:#e8ddd2;--acc:#b5654a;--acc2:#f3e3da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1816;--card:#262120;--ink:#f3ebe5;--mute:#a89b93;--line:#3a3230;--acc:#e08f72;--acc2:#3a2b26}}
:root[data-theme="dark"]{--bg:#1c1816;--card:#262120;--ink:#f3ebe5;--mute:#a89b93;--line:#3a3230;--acc:#e08f72;--acc2:#3a2b26}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 0}h1 span{color:var(--acc)}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mute);font:inherit;font-size:11px;padding:4px;cursor:pointer}
.tabs button i{font-style:normal;font-size:22px;line-height:1.2}
.tabs button.on{color:var(--acc);font-weight:600}
.tabs button.on i{background:var(--acc2);border-radius:14px;padding:0 16px}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.bar .ic{width:38px;height:38px;border-radius:11px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:20px}
.bar h1{margin:0;font-size:18px;line-height:1.2}.bar .sub{margin:0;font-size:11px}
.w{padding-bottom:100px}
#splash{position:fixed;inset:0;z-index:99;background:var(--acc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .5s}
#splash .big{font-size:64px}#splash b{font-size:26px}#splash span{font-size:13px;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chips button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw button.on{outline:3px solid var(--acc);outline-offset:2px}
.go{width:100%;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-size:15px;cursor:pointer;margin-top:12px}
.go:disabled{opacity:.5}
select,input[type=text],textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.out{white-space:pre-wrap;font-size:14px;margin-top:12px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
svg{display:block;margin:0 auto;max-width:100%}
.prev{background:var(--acc2);border-radius:16px;padding:8px}
.hide{display:none}
.copy{background:none;border:1px solid var(--acc);color:var(--acc);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<div id="splash"><div class="big">🩺</div><b>ScrubStyle AI</b><span>Your Style. Your Scrubs. Your Way.</span></div>
<div class="bar"><div class="ic">🩺</div><div><h1>ScrubStyle <span>AI</span></h1><p class="sub">مصمّمك الشخصي للاسكرب</p></div></div>
<div class="tabs" id="tabs">
<button data-t="d" class="on"><i>✨</i>اكتشفي</button><button data-t="c"><i>🎨</i>صمّمي</button><button data-t="r"><i>📷</i>من صورة</button>
</div>
<div class="w">

<section id="d">
<div class="card">
<label>التخصص</label>
<div class="chips" data-k="field"><button class="on">أسنان</button><button>علاج طبيعي</button><button>صيدلة</button></div>
<label>الستايل</label>
<div class="chips" data-k="style"><button class="on">مينيمال</button><button>أنثوي</button><button>سبورتي</button><button>جريء</button></div>
<button class="go" id="goD">اقترحي لي 5 أفكار مختلفة عن التقليدي</button>
<div class="out" id="outD"></div>
<div class="note">الأفكار دي اقتراحات تصميم إبداعية، مش ترندات مؤكدة. التطبيق مش بيضمن توفر منتج أو سعر.</div>
</div>
</section>

<section id="c" class="hide">
<div class="card prev"><svg id="sv" viewBox="0 0 240 330" width="260" role="img" aria-label="معاينة الاسكرب"></svg></div>
<div class="card">
<label>اللون</label><div class="sw" id="sw"></div>
<label>الياقة</label><div class="chips" data-k="neck"><button class="on" data-v="v">V ضيقة</button><button data-v="round">دائرية</button><button data-v="zip">سحاب</button><button data-v="wrap">راب</button></div>
<label>الأكمام</label><div class="chips" data-k="sleeve"><button class="on" data-v="short">قصيرة</button><button data-v="cap">كاب</button><button data-v="long">طويلة بكاف</button></div>
<label>البنطلون</label><div class="chips" data-k="pants"><button class="on" data-v="straight">Straight</button><button data-v="wide">Wide-leg</button><button data-v="jogger">Jogger</button></div>
<label>الجيوب</label><div class="chips" data-k="pocket"><button class="on" data-v="2">جيبين</button><button data-v="3">3 جيوب</button><button data-v="slant">مائلة</button></div>
<label>ملاحظات إضافية (اختياري)</label>
<input type="text" id="extra" placeholder="مثلاً: خياطات بارزة، ميزانية متوسطة">
<button class="go" id="goC">جهّزي لي Design Brief</button>
<div class="out" id="outC"></div>
</div>
</section>

<section id="r" class="hide">
<div class="card">
<label>ارفعي صورة اسكرب كمرجع</label>
<input type="file" id="file" accept="image/*">
<label>التعديل المطلوب (اختياري)</label>
<input type="text" id="mod" placeholder="مثلاً: نفس التصميم بلون أخضر مريمي وجيوب أكتر">
<button class="go" id="goR" disabled>حلّلي الصورة</button>
<div class="out" id="outR"></div>
<div class="note">الصورة بتتعامل كمرجع تصميم. التقليد الحرفي لتصميم محمي ممكن يكون له قيود حقوق، فالأفضل استخدامها كإلهام.</div>
</div>
</section>
</div>

<script>
setTimeout(()=>{const s=document.getElementById("splash");s.style.opacity=0;setTimeout(()=>s.remove(),500)},1200);
const COLORS=["#d9c5a8","#a8b8a0","#7b5a48","#e8b4b8","#6b7fa3","#2f4f4f","#c9a0dc","#f2f2f2"];
const S={field:"أسنان",style:"مينيمال",neck:"v",sleeve:"short",pants:"straight",pocket:"2",color:COLORS[0]};
const SYS="أنتِ ScrubStyle AI، مصممة أزياء ومتخصصة في اسكربات طبية عصرية لطالبات الجامعة والأطباء في الأسنان والعلاج الطبيعي والصيدلة. ردّي بالعامية المصرية المبسطة وبإيجاز. وازني دايمًا بين الموضة والراحة والعملية. ما تقوليش إن حاجة ترند مؤكد، وما تعدّيش بأسعار أو توفر. استخدمي نص عادي بدون Markdown.";
const $=id=>document.getElementById(id);
let samplePromise=null;
function getSample(){return samplePromise||(samplePromise=(async()=>{try{return await claude.use("sample")}catch(e){return null}})())}
async function ask(prompt,out,btn,opts){
  const s=await getSample();
  if(!s){out.textContent="الميزة دي بتشتغل بس لما الصفحة تتفتح من Claude.";return}
  btn.disabled=true;out.textContent="بفكر لك…";
  try{const r=await s(SYS+"\n\n"+prompt,Object.assign({cache:false,onText:t=>{out.textContent=t.text}},opts||{}));out.textContent=r.text;addCopy(out)}
  catch(e){out.textContent=e&&e.code==="not_granted"?"محتاجة توافقي على الإذن عشان أكمل.":"حصلت مشكلة، جرّبي تاني."}
  btn.disabled=false;
}
function addCopy(out){const b=document.createElement("button");b.className="copy";b.textContent="نسخ";b.onclick=()=>{try{navigator.clipboard.writeText(out.firstChild.textContent);b.textContent="تم النسخ"}catch(e){}};out.appendChild(b)}
document.querySelectorAll(".chips").forEach(g=>g.onclick=e=>{const b=e.target.closest("button");if(!b)return;g.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");S[g.dataset.k]=b.dataset.v||b.textContent;draw()});
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));["d","c","r"].forEach(k=>$(k).classList.toggle("hide",k!==b.dataset.t))};
COLORS.forEach((c,i)=>{const b=document.createElement("button");b.style.background=c;b.setAttribute("aria-label","لون "+(i+1));if(!i)b.className="on";b.onclick=()=>{S.color=c;document.querySelectorAll("#sw button").forEach(x=>x.classList.remove("on"));b.classList.add("on");draw()};$("sw").appendChild(b)});
function shade(h,a){const n=parseInt(h.slice(1),16);const f=v=>Math.max(0,Math.min(255,v+a));return"#"+[(n>>16)&255,(n>>8)&255,n&255].map(v=>f(v).toString(16).padStart(2,"0")).join("")}
function draw(){
  const c=S.color,d=shade(c,-35),st="stroke='"+d+"' stroke-width='2' stroke-linejoin='round'";
  let sl="";
  const sw={short:[22,52],cap:[12,38],long:[10,100]}[S.sleeve];
  const cuff=S.sleeve==="long"?`<rect x='6' y='${28+sw[1]-8}' width='28' height='8' fill='${d}'/><rect x='206' y='${28+sw[1]-8}' width='28' height='8' fill='${d}'/>`:"";
  sl=`<path d='M70 28 L${70-sw[0]-24} ${28+sw[1]} L${70-sw[0]+6} ${28+sw[1]+6} L84 60Z' fill='${c}' ${st}/><path d='M170 28 L${170+sw[0]+24} ${28+sw[1]} L${170+sw[0]-6} ${28+sw[1]+6} L156 60Z' fill='${c}' ${st}/>`;
  const body=`<path d='M70 28 L100 22 Q120 ${S.neck==="round"?44:56} 140 22 L170 28 L164 150 L76 150Z' fill='${c}' ${st}/>`;
  let neck="";
  if(S.neck==="v")neck=`<path d='M100 22 L120 62 L140 22' fill='${shade(c,25)}' ${st}/>`;
  if(S.neck==="round")neck=`<path d='M100 22 Q120 50 140 22' fill='${shade(c,25)}' ${st}/>`;
  if(S.neck==="zip")neck=`<path d='M100 22 Q120 36 140 22' fill='${shade(c,25)}' ${st}/><line x1='120' y1='32' x2='120' y2='110' stroke='${d}' stroke-width='2' stroke-dasharray='3 3'/>`;
  if(S.neck==="wrap")neck=`<path d='M100 22 L132 66 L140 22' fill='${shade(c,25)}' ${st}/><path d='M100 22 L112 70 L170 110' fill='none' stroke='${d}' stroke-width='2'/>`;
  const pk=S.pocket==="slant"?`<path d='M82 118 L104 108 L104 140 L82 140Z' fill='none' ${st}/><path d='M158 118 L136 108 L136 140 L158 140Z' fill='none' ${st}/>`:`<rect x='82' y='112' width='24' height='26' rx='3' fill='none' ${st}/><rect x='134' y='112' width='24' height='26' rx='3' fill='none' ${st}/>`+(S.pocket==="3"?`<rect x='140' y='78' width='14' height='14' rx='2' fill='none' ${st}/>`:"");
  const w={straight:[84,156,92,148],wide:[84,156,70,170],jogger:[84,156,94,146]}[S.pants];
  const ank=S.pants==="jogger"?`<rect x='${w[2]}' y='300' width='${w[3]-w[2]-62}' height='8' fill='${d}'/>`:"";
  const pants=`<path d='M${w[0]-8} 154 L${w[1]+8} 154 L${w[1]+6} 175 L${w[3]+4} 310 L122 310 L120 200 L118 310 L${w[2]-4} 310 L${w[0]-6} 175Z' fill='${shade(c,-12)}' ${st}/><rect x='${w[0]-8}' y='150' width='${w[1]-w[0]+16}' height='10' fill='${d}'/>`;
  $("sv").innerHTML=pants+body+sl+cuff+neck+pk;
}
draw();
$("goD").onclick=()=>ask(`اقترحي 5 أفكار اسكرب مختلفة عن التقليدي لتخصص ${S.field} بستايل ${S.style}. لكل فكرة: اسم، ألوان، القصّة، تفاصيل مميزة، والميزة العملية. وضّحي إنها اقتراحات إبداعية مش ترندات مؤكدة.`,$("outD"),$("goD"));
const L={v:"ياقة V ضيقة",round:"ياقة دائرية",zip:"سحاب أمامي",wrap:"ياقة راب",short:"أكمام قصيرة",cap:"أكمام كاب",long:"أكمام طويلة بكاف",straight:"بنطلون straight",wide:"بنطلون wide-leg",jogger:"بنطلون jogger",2:"جيبين",3:"3 جيوب",slant:"جيوب مائلة"};
$("goC").onclick=()=>ask(`جهّزي Design Brief تفصيلي لاسكرب: لون ${S.color}، ${L[S.neck]}، ${L[S.sleeve]}، ${L[S.pants]}، ${L[S.pocket]}. التخصص: ${S.field}. ملاحظات: ${$("extra").value||"لا يوجد"}. اذكري القماش المقترح، تفاصيل الخياطة، نصايح الراحة، وفي الآخر اكتبي برومبت إنجليزي جاهز لأداة توليد صور (product photo, front and back view).`,$("outC"),$("goC"));
let img=null;
$("file").onchange=e=>{img=e.target.files[0]||null;$("goR").disabled=!img};
$("goR").onclick=async()=>{
  const s=await getSample();let o={};
  if(s&&s.limits){try{const l=await s.limits();if(l.images)o.images=[img]}catch(e){}}
  if(!o.images){$("outR").textContent="تحليل الصور مش متاح هنا دلوقتي.";return}
  ask(`حلّلي الاسكرب في الصورة: القصّة، الياقة والإغلاق، الأكمام، الخياطات، الجيوب، البنطلون والخصر، اللون والقماش. وبعدين اكتبي Design Brief يحافظ على الخصائص الأساسية مع التعديل المطلوب فقط: ${$("mod").value||"بدون تعديل"}.`,$("outR"),$("goR"),o);
};
</script>
</body>
</html>
